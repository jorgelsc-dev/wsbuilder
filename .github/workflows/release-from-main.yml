name: release-from-main

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Read-only by default; only the release job gets write access.
permissions:
  contents: read

concurrency:
  group: release-from-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # Installs dependencies and runs the suite without any write permission.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ".[tls,mdns]"

      - name: Run tests before release
        run: PYTHONPATH=src pytest -q

  create-release:
    runs-on: ubuntu-latest
    needs: test
    # Tags the tested main commit, creates the GitHub Release and triggers the
    # publish workflow. The version comes from the tag through setuptools-scm,
    # so nothing is committed: no release branch and no version-bump PR.
    # Nothing here installs packages; the inline scripts use the standard library.
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Calculate semantic version from main history
        id: semver
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin --prune --tags --force

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"

          existing_tag="$(git tag --points-at "$TARGET_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          if [ -n "$existing_tag" ]; then
            # A re-run after a failure past the tagging step: finish that
            # release instead of skipping it. Every later step is idempotent
            # (existing tag, existing GitHub Release, skip-existing upload).
            echo "Commit ${TARGET_SHA} is already tagged ${existing_tag}; resuming that release."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "next_version=${existing_tag#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${latest_tag:-}" ]; then
            base_version="${latest_tag#v}"
            range="${latest_tag}..${TARGET_SHA}"
          else
            base_version="0.0.0"
            range="${TARGET_SHA}"
          fi

          commit_count="$(git rev-list --count "$range")"
          if [ "$commit_count" -eq 0 ]; then
            echo "No commits to release since ${latest_tag:-repository start}."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Publish only when what ships changes: the package, its metadata
          # or the README that PyPI shows. Docs, CI, tests and examples alone
          # do not produce a new version on PyPI.
          if [ -n "${latest_tag:-}" ]; then
            releasable="$(git diff --name-only "$latest_tag" "$TARGET_SHA" | python3 -c '
          import fnmatch
          import sys

          SHIPPED = ("src/*", "pyproject.toml", "MANIFEST.in", "LICENSE", "README.md")
          changed = [line.strip() for line in sys.stdin if line.strip()]
          hits = [path for path in changed if any(fnmatch.fnmatch(path, pattern) for pattern in SHIPPED)]
          print("true" if hits else "false")
          ')"
            if [ "$releasable" != "true" ]; then
              echo "Nothing that ships changed since ${latest_tag}; no release."
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          subjects_file="$(mktemp)"
          bodies_file="$(mktemp)"
          branches_file="$(mktemp)"

          git log --format=%s "$range" > "$subjects_file"
          git log --format=%B "$range" > "$bodies_file"
          git log --format=%s "$range" \
            | sed -nE "s/^Merge pull request #[0-9]+ from [^/]+\/([^ ]+).*$/\1/p" \
            > "$branches_file"

          calc="$(python - "$base_version" "$commit_count" "$subjects_file" "$bodies_file" "$branches_file" <<'PY'
          import re
          import sys
          from pathlib import Path

          base_version = sys.argv[1]
          commit_count = int(sys.argv[2])
          subjects_path = Path(sys.argv[3])
          bodies_path = Path(sys.argv[4])
          branches_path = Path(sys.argv[5])

          subjects = [line.strip() for line in subjects_path.read_text(encoding="utf-8").splitlines() if line.strip()]
          bodies = bodies_path.read_text(encoding="utf-8")
          branches = [line.strip().lower() for line in branches_path.read_text(encoding="utf-8").splitlines() if line.strip()]

          major_markers = {"breaking", "major"}
          minor_markers = {"feat", "feature", "minor", "enhancement"}
          patch_markers = {"fix", "hotfix", "bugfix", "patch", "docs", "chore", "refactor", "test", "ci", "perf"}

          major_score = 0
          minor_score = 0
          patch_score = 0

          if re.search(r"BREAKING[ -]CHANGE", bodies, re.IGNORECASE):
              major_score += 3

          for subject in subjects:
              if re.match(r"^[a-z]+(\([^)]+\))?!:", subject):
                  major_score += 3
                  continue
              if re.match(r"^feat(\([^)]+\))?:", subject, re.IGNORECASE):
                  minor_score += 2
              else:
                  patch_score += 1

          for branch in branches:
              token = branch.split("/", 1)[0]
              if token in major_markers or "breaking" in branch:
                  major_score += 3
              elif token in minor_markers:
                  minor_score += 2
              elif token in patch_markers:
                  patch_score += 1

          if major_score > 0:
              bump = "major"
          elif minor_score > 0:
              bump = "minor"
          else:
              bump = "patch"

          parsed = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", base_version)
          if parsed is None:
              raise SystemExit(f"Unsupported base version: {base_version}")
          major, minor, patch = map(int, parsed.groups())
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          else:
              patch += 1

          print(f"bump={bump}")
          print(f"next_version={major}.{minor}.{patch}")
          print(f"major_score={major_score}")
          print(f"minor_score={minor_score}")
          print(f"patch_score={patch_score}")
          print(f"commit_count={commit_count}")
          PY
          )"

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "$calc" >> "$GITHUB_OUTPUT"

          echo "base=${base_version}"
          echo "$calc"

      - name: Tag the tested main commit
        if: steps.semver.outputs.has_changes == 'true'
        env:
          BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          RULESET_TOKEN: ${{ secrets.RULESET_ADMIN_TOKEN }}
          ACTIONS_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.semver.outputs.next_version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BOT_TOKEN:-}" ]; then
            bot_token="$BOT_TOKEN"; token_source="RELEASE_BOT_TOKEN"
          elif [ -n "${RULESET_TOKEN:-}" ]; then
            bot_token="$RULESET_TOKEN"; token_source="RULESET_ADMIN_TOKEN"
          else
            bot_token="$ACTIONS_TOKEN"; token_source="GITHUB_TOKEN"
          fi
          # A tag pushed with GITHUB_TOKEN starts no workflow; publishing is
          # triggered explicitly below either way, so this is informational.
          echo "Pushing the release tag with ${token_source}."

          tag="v${NEXT_VERSION}"
          git remote set-url origin "https://x-access-token:${bot_token}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists. Skipping."
            exit 0
          fi

          git tag -a "$tag" -m "Release $tag" "$TARGET_SHA"
          git push origin "refs/tags/${tag}"
          echo "Created tag $tag on ${TARGET_SHA}"

      - name: Create GitHub Release
        if: steps.semver.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.semver.outputs.next_version }}
        run: |
          set -euo pipefail
          tag="v${NEXT_VERSION}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists."
            exit 0
          fi

          # The "Unreleased" section of CHANGELOG.md, when it has entries, opens
          # the release notes; GitHub's generated list of PRs follows it.
          notes_file="$(mktemp)"
          python3 - "$notes_file" <<'PY'
          import re
          import sys
          from pathlib import Path

          out = Path(sys.argv[1])
          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8") if changelog.exists() else ""
          match = re.search(r"^## \[Unreleased\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.MULTILINE | re.DOTALL)
          section = match.group(1).strip() if match else ""
          out.write_text(section + "\n" if section else "", encoding="utf-8")
          PY

          if [ -s "$notes_file" ]; then
            gh release create "$tag" --verify-tag --title "$tag" --notes-file "$notes_file" --generate-notes
          else
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes
          fi
          echo "Created GitHub Release $tag"

      - name: Trigger package publishing workflow on new tag
        if: steps.semver.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.semver.outputs.next_version }}
        run: |
          set -euo pipefail
          tag="v${NEXT_VERSION}"
          gh workflow run publish-packages.yml --ref "$tag"
          echo "Triggered publish-packages.yml for $tag"
