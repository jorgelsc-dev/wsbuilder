name: publish-packages

# Started only by release-from-main.yml (``gh workflow run --ref vX.Y.Z``) or
# by hand from the Actions tab on a tag. A tag push does not start it too, so
# a release is never built and uploaded twice.
on:
  workflow_dispatch:

# Read-only by default; each job asks only for what it uses.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Runs pip and the test suite, so it gets no OIDC token and no write access.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # setuptools-scm reads the version from the tag.
          fetch-depth: 0

      - name: Refuse anything but a release tag
        run: |
          case "${GITHUB_REF}" in
            refs/tags/v[0-9]*) echo "Publishing ${GITHUB_REF_NAME}" ;;
            *) echo "Run this workflow on a vX.Y.Z tag, not ${GITHUB_REF}."; exit 1 ;;
          esac

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest
          python -m pip install -e ".[tls,mdns]"

      - name: Run tests
        run: PYTHONPATH=src pytest -q

      - name: Build package
        run: |
          python -m build
          python -m twine check dist/*

      - name: Validate tag matches package version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          built="$(ls dist/*.whl)"
          package_version="$(basename "$built" | cut -d- -f2)"
          echo "tag=${tag_version} package=${package_version}"
          if [ "$tag_version" != "$package_version" ]; then
            echo "The built version does not match the tag (a dirty or untagged checkout?)."
            exit 1
          fi

      - name: Upload publish artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-publish-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-publish-${{ github.run_id }}
          path: dist

      - name: Publish to PyPI (API token)
        if: env.PYPI_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          user: __token__
          password: ${{ env.PYPI_TOKEN }}
          skip-existing: true

      - name: Publish to PyPI (Trusted Publishing fallback)
        if: env.PYPI_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  publish-github-release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-publish-${{ github.run_id }}
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
