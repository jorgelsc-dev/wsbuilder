name: publish-packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Read-only by default; each job asks only for what it uses.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Runs pip and the test suite, so it gets no OIDC token and no write access.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest
          python -m pip install -e ".[tls,mdns]"

      - name: Run tests
        run: PYTHONPATH=src pytest -q

      - name: Build package
        run: |
          python -m build
          python -m twine check dist/*

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["project"]["version"])
          PY
          )"

          echo "tag=${tag_version} package=${package_version}"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version and package version do not match"
            exit 1
          fi

      - name: Upload publish artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-publish-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-publish-${{ github.run_id }}
          path: dist

      - name: Publish to PyPI (API token)
        if: env.PYPI_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          user: __token__
          password: ${{ env.PYPI_TOKEN }}
          skip-existing: true

      - name: Publish to PyPI (Trusted Publishing fallback)
        if: env.PYPI_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  publish-github-release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-publish-${{ github.run_id }}
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
