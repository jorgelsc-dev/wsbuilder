name: package-build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # setuptools-scm derives the version from the tags.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest pytest-cov ruff==0.17.1
          python -m pip install -e ".[tls,mdns]"

      - name: Lint
        run: ruff check src tests examples

      - name: Build package
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Run tests with coverage
        run: |
          PYTHONPATH=src pytest -q --cov --cov-report=term --cov-report=xml

      - name: Type check (informational)
        if: matrix.python-version == '3.13'
        continue-on-error: true
        run: |
          python -m pip install mypy
          # Reported, not enforced, while type annotations are added gradually.
          mypy src/wsbuilder --ignore-missing-imports || true

      - name: Smoke test wheel install
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install --upgrade pip
          .venv-smoke/bin/python -m pip install dist/*.whl
          .venv-smoke/bin/python -c "import wsbuilder; print('wsbuilder', wsbuilder.__version__)"
          # The core install has no tls extra: the optional TLS names must stay
          # out of __all__ and behave as missing attributes.
          .venv-smoke/bin/python -c "from wsbuilder import *; import inspect, wsbuilder; assert 'TLSMaterial' not in wsbuilder.__all__; assert not hasattr(wsbuilder, 'TLSMaterial'); assert getattr(wsbuilder, 'install_tls', None) is None; inspect.getmembers(wsbuilder); print('core-only exports ok')"
          .venv-smoke/bin/wsbuilder --help

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.xml
          if-no-files-found: warn

      - name: Upload package artifacts
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
