site_name: WSBuilder Docs
site_description: Documentacion oficial de WSBuilder, con guias, referencia y ejemplos.
site_author: WSBuilder Authors
site_url: https://wsbuilder.jorgelsc.dev/
repo_url: https://github.com/jorgelsc-dev/wsbuilder
repo_name: WSBuilder
edit_uri: edit/main/docs/

nav:
  - Inicio: index.md
  - Ruta de aprendizaje:
      - Instalacion: install.md
      - Empezar: getting-started.md
      - Principiantes: beginners.md
      - Intermedios: intermediate.md
      - Avanzados: advanced.md
      - Que puedes hacer: capabilities.md
      - Proyecto integral: full-project.md
  - Guia:
      - Arquitectura: architecture.md
      - HTTP: http.md
      - App, rutas y HTTP: app-http.md
      - Versiones de HTTP: http-versions.md
      - WebSocket: websocket.md
      - Persistencia: persistence.md
      - Datos y ORM: data-orm.md
      - Cache: cache.md
      - Cache y seguridad: cache-security.md
      - Seguridad: security.md
      - Certificados TLS: tls-certificates.md
      - Observabilidad: observability.md
      - Observabilidad y tareas: observability-tasks.md
      - Tareas: tasks.md
      - Proxy: proxy.md
      - Red y edge: network-edge.md
      - RPC entre servicios: rpc.md
      - DNS: dns.md
      - mDNS: mdns.md
      - IA (experimental): ia.md
      - Prediccion (experimental): ai-predict.md
      - Modelos de lenguaje (experimental): llm.md
  - Referencia:
      - reference/index.md
      - API publica: api-map.md
      - Cambios: changelog.md
  - Ayuda: help/index.md

# Every page under docs/ must be reachable from the menu: mkdocs build --strict
# fails when one is left out of nav.
validation:
  nav:
    omitted_files: warn
    not_found: warn

theme:
  name: material
  language: es
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  logo: assets/wsbuilder-mark.svg

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css
