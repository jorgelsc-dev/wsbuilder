site_name: WSBuilder Docs
site_description: Documentacion oficial de WSBuilder
site_author: WSBuilder Authors
site_url: https://wsbuilder.jorgelsc.dev/
repo_url: https://github.com/jorgelsc-dev/wsbuilder
repo_name: WSBuilder
edit_uri: edit/main/docs/

nav:
  - Inicio: index.md
  - Que puedes hacer: capabilities.md
  - Aprender por nivel:
      - Principiantes: beginners.md
      - Intermedios: intermediate.md
      - Avanzados: advanced.md
  - Instalacion: install.md
  - Guias por modulo:
      - Arquitectura: architecture.md
      - App y HTTP: app-http.md
      - WebSocket: websocket.md
      - Datos y ORM: data-orm.md
      - Cache y Seguridad: cache-security.md
      - Observabilidad y Tareas: observability-tasks.md
      - Red y Edge: network-edge.md
      - IA y Prediccion: ai-predict.md
  - Referencia:
      - API publica: api-map.md
      - Proyecto integral: full-project.md

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
